name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        
    - name: Go Format and Vet
      run: |
        for dir in services/*/ libs/*/; do
          if [ -f "$dir/go.mod" ]; then
            cd $dir
            go vet ./...
            cd -
          fi
        done

    - name: Go Test
      run: |
        for dir in services/*/ libs/*/; do
          if [ -f "$dir/go.mod" ]; then
            cd $dir
            go test ./... -v
            cd -
          fi
        done

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint
      
    - name: Run Tests
      run: npm run test
