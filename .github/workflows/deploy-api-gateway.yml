name: Deploy API Gateway

on:
  push:
    branches: ["prod"]
    paths:
      - "services/api-gateway/**"
      - "infrastructure/k8s/api-gateway.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-gateway
  cancel-in-progress: true

jobs:
  run-deploy:
    uses: ./.github/workflows/deploy-k8s-template.yml
    with:
      service_name: "api-gateway"
      build_context: "."
      dockerfile: "services/api-gateway/Dockerfile"
      manifest_path: "infrastructure/k8s/api-gateway.yaml"
      deployment_name: "api-gateway"
      namespace: "sumdyk"
    secrets: inherit
