name: Deploy Chat Service

on:
  push:
    branches: ["prod"]
    paths:
      - "services/chat-service/**"
      - "infrastructure/k8s/chat-service.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chat-service
  cancel-in-progress: true

jobs:
  run-deploy:
    uses: ./.github/workflows/deploy-k8s-template.yml
    with:
      service_name: "chat-service"
      build_context: "."
      dockerfile: "services/chat-service/Dockerfile"
      manifest_path: "infrastructure/k8s/chat-service.yaml"
      deployment_name: "chat-service"
      namespace: "sumdyk"
    secrets: inherit
