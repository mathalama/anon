name: Deploy Base (DB & WebRTC)
on:
  push:
    branches: ["prod"]
    paths:
      - "infrastructure/docker/docker-compose.infra.yml"
      - "infrastructure/docker/postgres/init/**"
  workflow_run:
    workflows: ["Provision Server"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Infrastructure
        uses: appleboy/ssh-action@v1.2.0
        env:
          WORKDIR: "${{ secrets.DEPLOY_PATH }}/app"
          COMMON_ENV: "${{ secrets.COMMON_ENV }}"
          TURN_EXTERNAL_IP: "${{ secrets.SSH_HOST }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: WORKDIR,COMMON_ENV,TURN_EXTERNAL_IP,GITHUB_TOKEN,GITHUB_REPOSITORY
          script: |
            set -eu
            if [ ! -d "$WORKDIR/.git" ]; then
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORKDIR"
            fi

            cd "$WORKDIR"
            git pull --ff-only
            printf '%s\nTURN_EXTERNAL_IP=%s\n' "$COMMON_ENV" "$TURN_EXTERNAL_IP" > .env

            docker network inspect nektokz-network >/dev/null 2>&1 || docker network create nektokz-network
            docker compose -f infrastructure/docker/docker-compose.infra.yml up -d
