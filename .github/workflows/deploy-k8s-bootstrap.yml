name: Bootstrap Kubernetes
on:
  workflow_run:
    workflows: ["Deploy Base (DB & WebRTC)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-k8s-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Apply namespace, configmap, and secret
        uses: appleboy/ssh-action@v1.2.0
        env:
          FINAL_PATH: "${{ secrets.DEPLOY_PATH }}/app"
          APP_ENV: "production"
          LOG_LEVEL: "info"
          ALLOWED_ORIGINS: "${{ secrets.ALLOWED_ORIGINS }}"
          DEV_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
          USER_SERVICE_URL: "http://user-service:8081"
          MATCHMAKING_SERVICE_URL: "http://matchmaking-service:8082"
          CHAT_SERVICE_URL: "http://chat-service:8083"
          MODERATION_SERVICE_URL: "http://moderation-service:8084"
          NOTIFICATION_SERVICE_URL: "http://notification-service:8085"
          JWT_SECRET: "${{ secrets.JWT_SECRET }}"
          INTERNAL_TOKEN: "${{ secrets.INTERNAL_TOKEN }}"
          DB_URL: "${{ secrets.DB_URL }}"
          REDIS_URL: "${{ secrets.REDIS_URL }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: FINAL_PATH,APP_ENV,LOG_LEVEL,ALLOWED_ORIGINS,DEV_ALLOWED_ORIGINS,USER_SERVICE_URL,MATCHMAKING_SERVICE_URL,CHAT_SERVICE_URL,MODERATION_SERVICE_URL,NOTIFICATION_SERVICE_URL,JWT_SECRET,INTERNAL_TOKEN,DB_URL,REDIS_URL,GITHUB_TOKEN,GITHUB_REPOSITORY
          script: |
            set -eu
            export KUBECONFIG="$HOME/.kube/config"

            if [ ! -d "$FINAL_PATH/.git" ]; then
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$FINAL_PATH"
            fi

            cd "$FINAL_PATH"
            git pull --ff-only

            kubectl apply -f infrastructure/k8s/namespace.yaml

            kubectl create configmap sumdyk-config \
              --namespace sumdyk \
              --from-literal=APP_ENV="$APP_ENV" \
              --from-literal=LOG_LEVEL="$LOG_LEVEL" \
              --from-literal=ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
              --from-literal=DEV_ALLOWED_ORIGINS="$DEV_ALLOWED_ORIGINS" \
              --from-literal=USER_SERVICE_URL="$USER_SERVICE_URL" \
              --from-literal=MATCHMAKING_SERVICE_URL="$MATCHMAKING_SERVICE_URL" \
              --from-literal=CHAT_SERVICE_URL="$CHAT_SERVICE_URL" \
              --from-literal=MODERATION_SERVICE_URL="$MODERATION_SERVICE_URL" \
              --from-literal=NOTIFICATION_SERVICE_URL="$NOTIFICATION_SERVICE_URL" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl create secret generic sumdyk-secrets \
              --namespace sumdyk \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --from-literal=INTERNAL_TOKEN="$INTERNAL_TOKEN" \
              --from-literal=DB_URL="$DB_URL" \
              --from-literal=REDIS_URL="$REDIS_URL" \
              --dry-run=client -o yaml | kubectl apply -f -
