name: Deploy Moderation Service

on:
  push:
    branches: ["prod"]
    paths:
      - "services/moderation-service/**"
      - "infrastructure/k8s/moderation-service.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-moderation-service
  cancel-in-progress: true

jobs:
  run-deploy:
    uses: ./.github/workflows/deploy-k8s-template.yml
    with:
      service_name: "moderation-service"
      build_context: "."
      dockerfile: "services/moderation-service/Dockerfile"
      manifest_path: "infrastructure/k8s/moderation-service.yaml"
      deployment_name: "moderation-service"
      namespace: "sumdyk"
    secrets: inherit
