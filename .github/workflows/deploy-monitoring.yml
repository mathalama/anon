name: Deploy Monitoring & Proxy
on:
  push:
    branches: ["prod"]
    paths:
      - "infrastructure/docker/docker-compose.monitoring.yml"
      - "infrastructure/monitoring/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy Monitoring Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "infrastructure/docker/docker-compose.monitoring.yml,infrastructure/monitoring/**"
          target: "${{ secrets.DEPLOY_PATH }}/monitoring"

      - name: Start Monitoring Stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}/monitoring

            # Stop old monitoring containers
            docker compose -f docker-compose.monitoring.yml down

            # Start fresh monitoring stack
            docker compose -f docker-compose.monitoring.yml up -d

            echo "Monitoring stack deployed"
