name: Deploy Monitoring & Proxy
on:
  push:
    branches: ["prod"]
    paths:
      - "infrastructure/docker/docker-compose.monitoring.yml"
      - "infrastructure/monitoring/**"
  workflow_run:
    workflows: ["Deploy Base (DB & WebRTC)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-monitoring
  cancel-in-progress: true

jobs:
  deploy-monitoring:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Monitoring Stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          WORKDIR: "${{ secrets.DEPLOY_PATH }}/app"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: WORKDIR,GITHUB_TOKEN,GITHUB_REPOSITORY
          script: |
            set -eu
            if [ ! -d "$WORKDIR/.git" ]; then
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORKDIR"
            fi

            cd "$WORKDIR"

            git pull --ff-only

            docker compose -f infrastructure/docker/docker-compose.monitoring.yml down
            docker compose -f infrastructure/docker/docker-compose.monitoring.yml up -d

            echo "Monitoring stack deployed"
