name: Reusable Deploy Template
on:
  workflow_call:
    inputs:
      service_folder:
        required: true
        type: string
      image_name:
        required: true
        type: string
      compose_service:
        required: true
        type: string
      env_image_var:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ inputs.service_folder }}/go.mod
          cache: true

      - name: Run tests
        run: go test ./services/${{ inputs.service_folder }}/...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: image
        run: |
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="ghcr.io/${OWNER_LOWER}/${{ inputs.image_name }}:sha-${GITHUB_SHA::7}"
          echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ inputs.service_folder }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:cache,mode=max

  provision:
    needs: build-and-push
    name: Ansible — Configure Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install --quiet ansible

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Write Ansible secrets
        run: |
          cat > infrastructure/ansible/group_vars/secrets.yml << 'EOF'
          db_password: "${{ secrets.DB_PASSWORD }}"
          jwt_secret: "${{ secrets.JWT_SECRET }}"
          internal_token: "${{ secrets.INTERNAL_TOKEN }}"
          ssh_public_key: "${{ secrets.SSH_PUBLIC_KEY }}"
          EOF

      - name: Write Ansible inventory
        run: |
          cat > infrastructure/ansible/inventory.ini << 'EOF'
          [servers]
          server1 ansible_host=${{ secrets.SSH_HOST }} ansible_user=${{ secrets.SSH_USER }}

          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Run Ansible Playbook
        run: >
          ansible-playbook
          -i infrastructure/ansible/inventory.ini
          infrastructure/ansible/playbook.yml
          --tags "base,docker,security"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

  deploy:
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "infrastructure/docker/docker-compose.services.yml"
          target: "${{ secrets.DEPLOY_PATH }}/app"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          FINAL_PATH: "${{ secrets.DEPLOY_PATH }}/app"
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_USER: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE,FINAL_PATH,GH_TOKEN,GH_USER
          script: |
            set -eu
            cd "$FINAL_PATH"

            sed -i '/^${{ inputs.env_image_var }}=/d' .env
            echo "${{ inputs.env_image_var }}=$IMAGE" >> .env

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

            docker compose -f docker-compose.services.yml pull ${{ inputs.compose_service }}
            docker compose -f docker-compose.services.yml up -d --no-deps ${{ inputs.compose_service }}

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu

            echo "Waiting for ${{ inputs.compose_service }} to start..."
            sleep 5

            STATUS=$(docker inspect --format='{{.State.Status}}' ${{ inputs.compose_service }} 2>/dev/null || echo "not_found")

            if [ "$STATUS" != "running" ]; then
              echo "ERROR: ${{ inputs.compose_service }} is not running (status: $STATUS)"
              docker logs ${{ inputs.compose_service }} --tail 50 || true
              exit 1
            fi

            echo "OK: ${{ inputs.compose_service }} is running"
