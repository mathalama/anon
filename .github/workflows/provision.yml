name: Provision Server

on:
  push:
    branches: ["prod"]
    paths:
      - "infrastructure/ansible/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision
  cancel-in-progress: true

jobs:
  ansible:
    name: Ansible — Configure Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install --quiet ansible

      - name: Write SSH private key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Key lines: $(wc -l < ~/.ssh/deploy_key)"
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -v ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo SSH OK" 2>&1 | tail -30

      - name: Write Ansible secrets
        run: |
          cat > infrastructure/ansible/group_vars/secrets.yml << 'EOF'
          db_password: "${{ secrets.DB_PASSWORD }}"
          jwt_secret: "${{ secrets.JWT_SECRET }}"
          internal_token: "${{ secrets.INTERNAL_TOKEN }}"
          ssh_public_key: "${{ secrets.SSH_PUBLIC_KEY }}"
          EOF

      - name: Write Ansible inventory
        run: |
          cat > infrastructure/ansible/inventory.ini << 'EOF'
          [servers]
          server1 ansible_host=${{ secrets.SSH_HOST }} ansible_user=${{ secrets.SSH_USER }}

          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Run Ansible Playbook
        run: >
          ansible-playbook
          -i infrastructure/ansible/inventory.ini
          infrastructure/ansible/playbook.yml
          --private-key ~/.ssh/deploy_key
          --tags "base,docker,k3s,security"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
