name: SRE Capacity & Self-Healing Test

on:
  workflow_dispatch:
    inputs:
      run_self_healing_test:
        description: "Trigger the self-healing check after the load test"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  sre-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user ansible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create temporary inventory
        run: |
          cat > inventory.ini <<EOF
          [servers]
          server1 ansible_host=${{ secrets.SERVER_HOST }} ansible_user=${{ secrets.SERVER_USER }}
          EOF

      - name: Run SRE capacity test
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          TARGET_URL: ${{ secrets.BASE_URL }}/api/v1
          RUN_SELF_HEALING_TEST: ${{ inputs.run_self_healing_test }}
        run: |
          ansible-playbook -i inventory.ini infrastructure/ansible/stress-test.yml
