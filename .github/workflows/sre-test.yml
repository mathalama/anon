name: SRE Capacity & Self-Healing Test
on:
  workflow_dispatch:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  sre-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Run Ansible SRE Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          # Generate a temporary inventory file for GitHub Actions
          cat <<EOF > inventory.ini
          [servers]
          server1 ansible_host=${{ secrets.SSH_HOST }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa
          EOF
          
          # Run the playbook
          ansible-playbook -i inventory.ini ansible/stress-test.yml
