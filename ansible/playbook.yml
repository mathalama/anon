---
- name: Professional Server Configuration and Application Deployment
  hosts: all
  become: yes
  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: Load private secrets vars when present
      include_vars:
        file: "{{ item }}"
      with_first_found:
        - files:
            - "group_vars/secrets.yml"
            - "group_vars/secrets.vault.yml"
          skip: true
      tags: [always]

    - name: Validate required deployment secrets
      assert:
        that:
          - db_password is defined and db_password != ""
          - jwt_secret is defined and jwt_secret != ""
          - internal_token is defined and internal_token != ""
        fail_msg: "Required secrets are missing. Please configure group_vars/secrets.yml"
      tags: [always]

  roles:
    - { role: config-validation, tags: ["validate", "setup", "always"] }
    - { role: base, tags: ["base", "setup"] }
    - { role: docker, tags: ["docker", "setup"] }
    - { role: security, tags: ["security", "setup"] }
