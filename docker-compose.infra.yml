services:
  postgres:
    image: postgres:16-alpine
    container_name: nektokz-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - nektokz-network

  redis:
    image: redis:7-alpine
    container_name: nektokz-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - nektokz-network

  coturn:
    image: coturn/coturn
    container_name: nektokz-coturn
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
    environment:
      - TURN_USER=${TURN_USER}
      - TURN_PASSWORD=${TURN_PASSWORD}
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP}
    command:
      - turnserver
      - --log-file=stdout
      - --external-ip=${TURN_EXTERNAL_IP}
      - --realm=nektokz.kz
      - --user=$${TURN_USER}:$${TURN_PASSWORD}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=65535
      - --verbose
    networks:
      - nektokz-network

networks:
  nektokz-network:
    name: nektokz-network

volumes:
  postgres_data:
  redis_data:
