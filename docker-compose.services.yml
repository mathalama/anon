services:
  api-gateway:
    build:
      context: ./api-gateway
    container_name: nektokz-gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      - PORT=${API_GATEWAY_PORT}
      - REDIS_URL=nektokz-redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:8081
      - MATCHMAKING_SERVICE_URL=http://matchmaking-service:8082
      - CHAT_SERVICE_URL=http://chat-service:8083
      - MODERATION_SERVICE_URL=http://moderation-service:8084
    depends_on:
      user-service:
        condition: service_healthy
      matchmaking-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      moderation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${API_GATEWAY_PORT}/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  user-service:
    build:
      context: ./user-service
    container_name: nektokz-user
    environment:
      - PORT=8081
      - REPO_DRIVER=postgres
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@nektokz-postgres:5432/users_db?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  matchmaking-service:
    build:
      context: ./matchmaking-service
    container_name: nektokz-matchmaking
    environment:
      - PORT=8082
      - REPO_DRIVER=redis
      - REDIS_URL=redis://nektokz-redis:6379
      - USER_SERVICE_URL=http://user-service:8081
      - CHAT_SERVICE_URL=http://chat-service:8083
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  chat-service:
    build:
      context: ./chat-service
    container_name: nektokz-chat
    environment:
      - PORT=8083
      - REPO_DRIVER=postgres
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@nektokz-postgres:5432/chat_db?sslmode=disable
      - MODERATION_SERVICE_URL=http://moderation-service:8084
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - REDIS_URL=nektokz-redis:6379
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  moderation-service:
    build:
      context: ./moderation-service
    container_name: nektokz-moderation
    environment:
      - PORT=8084
      - REPO_DRIVER=postgres
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@nektokz-postgres:5432/moderation_db?sslmode=disable
      - USER_SERVICE_URL=http://user-service:8081
      - CHAT_SERVICE_URL=http://chat-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  notification-service:
    build:
      context: ./notification-service
    container_name: nektokz-notification
    environment:
      - PORT=8085
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

networks:
  nektokz-network:
    external: true
