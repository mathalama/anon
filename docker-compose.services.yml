services:
  api-gateway:
    image: ${API_GATEWAY_IMAGE:-ghcr.io/mathalama/api-gateway:latest}
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_BIND_ADDRESS:-0.0.0.0}:${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
    environment:
      - PORT=${API_GATEWAY_PORT:-8080}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT:-8081}
      - MATCHMAKING_SERVICE_URL=http://matchmaking-service:${MATCHMAKING_SERVICE_PORT:-8082}
      - CHAT_SERVICE_URL=http://chat-service:${CHAT_SERVICE_PORT:-8083}
      - MODERATION_SERVICE_URL=http://moderation-service:${MODERATION_SERVICE_PORT:-8084}
    depends_on:
      user-service:
        condition: service_healthy
      matchmaking-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      moderation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${API_GATEWAY_PORT:-8080}/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  user-service:
    image: ${USER_SERVICE_IMAGE:-ghcr.io/mathalama/user-service:latest}
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      - PORT=${USER_SERVICE_PORT:-8081}
      - REPO_DRIVER=${USER_REPO_DRIVER:-postgres}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/users_db?sslmode=disable&pool_max_conns=50&pool_min_conns=10
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${USER_SERVICE_PORT:-8081}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  matchmaking-service:
    image: ${MATCHMAKING_SERVICE_IMAGE:-ghcr.io/mathalama/matchmaking-service:latest}
    build:
      context: .
      dockerfile: matchmaking-service/Dockerfile
    container_name: matchmaking-service
    restart: unless-stopped
    environment:
      - PORT=${MATCHMAKING_SERVICE_PORT:-8082}
      - REPO_DRIVER=${MATCHMAKING_REPO_DRIVER:-redis}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}
      - USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT:-8081}
      - CHAT_SERVICE_URL=http://chat-service:${CHAT_SERVICE_PORT:-8083}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${MATCHMAKING_SERVICE_PORT:-8082}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  chat-service:
    image: ${CHAT_SERVICE_IMAGE:-ghcr.io/mathalama/chat-service:latest}
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    restart: unless-stopped
    environment:
      - PORT=${CHAT_SERVICE_PORT:-8083}
      - REPO_DRIVER=${CHAT_REPO_DRIVER:-postgres}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/chat_db?sslmode=disable&pool_max_conns=25&pool_min_conns=5&pool_max_conn_lifetime=1h&pool_max_conn_idle_time=30m
      - MODERATION_SERVICE_URL=http://moderation-service:${MODERATION_SERVICE_PORT:-8084}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${CHAT_SERVICE_PORT:-8083}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  moderation-service:
    image: ${MODERATION_SERVICE_IMAGE:-ghcr.io/mathalama/moderation-service:latest}
    build:
      context: .
      dockerfile: moderation-service/Dockerfile
    container_name: moderation-service
    restart: unless-stopped
    environment:
      - PORT=${MODERATION_SERVICE_PORT:-8084}
      - REPO_DRIVER=${MODERATION_REPO_DRIVER:-postgres}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/moderation_db?sslmode=disable&pool_max_conns=25&pool_min_conns=5&pool_max_conn_lifetime=1h&pool_max_conn_idle_time=30m
      - USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT:-8081}
      - CHAT_SERVICE_URL=http://chat-service:${CHAT_SERVICE_PORT:-8083}
      - NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT:-8085}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${MODERATION_SERVICE_PORT:-8084}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

  notification-service:
    image: ${NOTIFICATION_SERVICE_IMAGE:-ghcr.io/mathalama/notification-service:latest}
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      - PORT=${NOTIFICATION_SERVICE_PORT:-8085}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${NOTIFICATION_SERVICE_PORT:-8085}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - nektokz-network

networks:
  nektokz-network:
    external: true
