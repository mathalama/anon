---
- name: Smoke check API gateway endpoints
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    base_url: "http://localhost:8080"
  tasks:
    - name: Check gateway health
      uri:
        url: "{{ base_url }}/api/v1/health"
        method: GET
        return_content: true
      register: health

    - name: Create anonymous user
      uri:
        url: "{{ base_url }}/api/v1/users/anonymous"
        method: POST
        body_format: json
        body:
          device_id: "ansible-smoke-{{ lookup('pipe', 'date +%s') }}"
        return_content: true
      register: anon

    - name: Parse access token
      set_fact:
        access_token: "{{ (anon.content | from_json).access_token }}"

    - name: Check /users/me
      uri:
        url: "{{ base_url }}/api/v1/users/me"
        method: GET
        headers:
          Authorization: "Bearer {{ access_token }}"
        return_content: true
      register: me

    - name: Start search
      uri:
        url: "{{ base_url }}/api/v1/match/search"
        method: POST
        headers:
          Authorization: "Bearer {{ access_token }}"
        body_format: json
        body:
          filter:
            my_gender: male
            gender: any
            mode: voice
      register: search

    - name: Cancel search
      uri:
        url: "{{ base_url }}/api/v1/match/search"
        method: DELETE
        headers:
          Authorization: "Bearer {{ access_token }}"
      register: cancel
