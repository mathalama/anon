# --- System Configuration ---
swap_size: 2G
swappiness: 10
arch: amd64

# --- Deployment Configuration ---
deploy_user: devops
project_root: /home/devops/deploy
repo_url: git@github.com:mathalama/anon.git
app_version: prod
k3s_version: "v1.31.0+k3s1"

# --- Ports for Firewall ---
allowed_ports:
  - 22 # SSH
  - 80 # HTTP
  - 443 # HTTPS
  - 81 # NPM Admin
  - 3000 # Grafana
  - 9090 # Prometheus
  - 6443 # Kubernetes API

# --- Infrastructure Ports ---
postgres_port: 5432
redis_port: 6379

# --- Global Application Variables ---
app_env: production
log_level: info

# --- Service Ports ---
api_gateway_port: 8080
user_service_port: 8081
matchmaking_service_port: 8082
chat_service_port: 8083
moderation_service_port: 8084
notification_service_port: 8085

# --- Database ---
db_user: mathalama

# --- Frontend ---
# Задаётся через ALLOWED_ORIGINS в .env / GitHub Secret COMMON_ENV
allowed_origins: "{{ lookup('env', 'ALLOWED_ORIGINS') | default('https://yourdomain.com') }}"
dev_allowed_origins: "http://localhost:3000,http://127.0.0.1:3000"
next_public_api_url: "{{ lookup('env', 'NEXT_PUBLIC_API_URL') | default('https://api.yourdomain.com/api/v1') }}"
next_public_ws_url: "{{ lookup('env', 'NEXT_PUBLIC_WS_URL') | default('wss://api.yourdomain.com/ws') }}"

# --- Coturn ---
turn_user: nektokz
turn_external_ip: "{{ lookup('env', 'TURN_EXTERNAL_IP') | default('127.0.0.1') }}"
turn_realm: nektokz.kz
turn_port: 3478
turn_tls_port: 5349

# --- Moderation ---
toxic_words: "сука,блять,хуй,пизда,fuck,shit,bitch"

# --- Notification ---
smtp_host: smtp.gmail.com
smtp_port: 587

# --- SSH ---
ssh_public_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
