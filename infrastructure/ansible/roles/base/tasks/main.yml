---
- import_tasks: user.yml

- name: Update apt cache and upgrade packages
  apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Install base utilities
  apt:
    name:
      - curl
      - git
      - gnupg
      - ca-certificates
      - python3-pip
    state: present

- name: Check if swap file exists
  stat:
    path: /swapfile
  register: swap_stat

- name: Create swap file
  command: "fallocate -l {{ swap_size }} /swapfile"
  when: not swap_stat.stat.exists

- name: Set swap file permissions
  file:
    path: /swapfile
    mode: '0600'
  when: not swap_stat.stat.exists

- name: Format swap file
  command: mkswap /swapfile
  when: not swap_stat.stat.exists

- name: Enable swap file
  command: swapon /swapfile
  when: ansible_swaptotal_mb == 0

- name: Add swap to fstab
  lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present

- name: Configure swappiness
  sysctl:
    name: vm.swappiness
    value: "{{ swappiness | string }}"
    state: present
    reload: yes

- name: Setup weekly crontab for Docker prune
  cron:
    name: "Docker image prune"
    special_time: weekly
    job: "docker image prune -a -f"

- name: Setup weekly crontab for K3s prune
  cron:
    name: "K3s image prune"
    special_time: weekly
    job: "crictl rmi --prune"
