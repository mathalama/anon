---
- name: Validate environment variables and configuration facts
  assert:
    that:
      - app_env in ['development', 'staging', 'production']
      - db_user is defined and db_user | length > 0
      - db_password is defined and db_password | length > 0
      - jwt_secret is defined and jwt_secret | length > 0
      - internal_token is defined and internal_token | length > 0
    fail_msg: "Environment variables validation failed: Check db_user, db_password, jwt_secret, and internal_token."

- name: Validate service endpoints and connection strings
  assert:
    that:
      - postgres_port | int > 0 and postgres_port | int < 65536
      - redis_port | int > 0 and redis_port | int < 65536
      - api_gateway_port | int > 0 and api_gateway_port | int < 65536
      - user_service_port | int > 0 and user_service_port | int < 65536
      - matchmaking_service_port | int > 0 and matchmaking_service_port | int < 65536
      - chat_service_port | int > 0 and chat_service_port | int < 65536
    fail_msg: "Invalid service endpoints or connection string parts (ports)."

- name: Validate secrets complexity for production
  assert:
    that:
      - db_password | string != 'postgres' and db_password | string != 'password'
      - jwt_secret | length >= 16
      - internal_token | length >= 16
    fail_msg: "Insecure secrets detected! Do not use default or short passwords/tokens in production."
  when: app_env == 'production'

- name: Validate application URLs & CORS
  assert:
    that:
      - next_public_api_url is match("^https?://.*")
      - next_public_ws_url is match("^wss?://.*")
      - allowed_origins != "*"
    fail_msg: "Invalid URLs formats (must start with http/https or ws/wss), or wildcard CORS is used."
  when: app_env == 'production'

- name: Check if Docker Compose template files exist
  stat:
    path: "{{ playbook_dir }}/../docker/{{ item }}"
  loop:
    - docker-compose.infra.yml
    - docker-compose.services.yml
    - docker-compose.monitoring.yml
  register: compose_files
  delegate_to: localhost
  become: no

- name: Fail if template files are missing
  assert:
    that:
      - item.stat.exists
    fail_msg: "Template file {{ item.item }} is missing."
  loop: "{{ compose_files.results }}"
