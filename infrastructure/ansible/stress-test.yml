---
- name: Advanced SRE Capacity Analysis and Self-Healing Test
  hosts: all
  become: yes
  vars:
    target_url: "{{ lookup('env', 'TARGET_URL') | default('', true) }}"
    run_self_healing_test: "{{ lookup('env', 'RUN_SELF_HEALING_TEST') | default('false', true) | bool }}"
    load_levels:
      - { name: "low", reqs: 1000, conc: 10 }
      - { name: "medium", reqs: 2000, conc: 25 }
      - { name: "heavy", reqs: 10000, conc: 50 }

  tasks:
    - name: Ensure target_url is provided
      assert:
        that:
          - target_url | length > 0
        fail_msg: "Set TARGET_URL to the API base URL before running the capacity test."

    - name: Ensure apache2-utils is installed
      apt:
        name: apache2-utils
        state: present
        update_cache: yes

    - name: 2. Capacity Planning - Multi-level Stress Test on API Gateway
      shell: "ab -n {{ item.reqs }} -c {{ item.conc }} -s 30 {{ target_url }}/health"
      register: load_results
      loop: "{{ load_levels }}"
      failed_when: false
      loop_control:
        label: "Testing level: {{ item.name }} ({{ item.reqs }} reqs, {{ item.conc }} conc)"

    - name: 3. Save Load Results to Files
      copy:
        content: "{{ item.stdout if item.rc == 0 else item.stderr }}"
        dest: "/tmp/capacity_report_{{ item.item.name }}.txt"
      loop: "{{ load_results.results }}"
      loop_control:
        label: "Saving results for {{ item.item.name }}"

    - name: 4. Display Analysis Summary
      debug:
        msg:
          - "--- CAPACITY ANALYSIS REPORT ---"
          - "Level: {{ item.item.name }}"
          - "Requests/sec: {{ item.stdout | regex_search('Requests per second:.*') | default('FAILED') }}"
          - "Time per req: {{ item.stdout | regex_search('Time per request:.*') | default('FAILED') }}"
          - "Failed reqs: {{ item.stdout | regex_search('Failed requests:.*') | default('0') }}"
          - "Error Details: {{ item.stderr if item.rc != 0 else 'None' }}"
      loop: "{{ load_results.results }}"
      loop_control:
        label: "Reporting for {{ item.item.name }}"

    - name: 5. Automation Test - Restart API Gateway deployment (Self-Healing)
      shell: "/usr/local/bin/k3s kubectl -n sumdyk rollout restart deployment/api-gateway"
      register: restart_result
      failed_when: false
      when: run_self_healing_test

    - name: 6. Wait for Self-Healing (restart policy)
      pause:
        seconds: 90
      when: run_self_healing_test

    - name: 7. Verify Container Recovery
      shell: "/usr/local/bin/k3s kubectl -n sumdyk rollout status deployment/api-gateway --timeout=300s"
      register: container_status
      when: run_self_healing_test

    - name: 8. Report Recovery Status
      debug:
        msg:
          - "--- SELF-HEALING TEST ---"
          - "Action: Restarted deployment/api-gateway"
          - "Current Status: {{ container_status.stdout }}"
          - "Verdict: {{ 'SUCCESS - Service Recovered' if 'successfully rolled out' in container_status.stdout else 'FAILURE - Service Down' }}"
      when: run_self_healing_test

    - name: 9. Final Instructions
      debug:
        msg: "Full reports saved to /tmp/capacity_report_*.txt on the server. Analyze Grafana during the test times for CPU/Memory correlations."
