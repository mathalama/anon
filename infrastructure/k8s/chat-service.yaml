apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: sumdyk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: __IMAGE__
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 2048Mi
        ports:
        - containerPort: 8083
        env:
        - name: PORT
          value: "8083"
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: sumdyk-secrets
              key: CHAT_DB_URL
        envFrom:
        - configMapRef:
            name: sumdyk-config
        - secretRef:
            name: sumdyk-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: sumdyk
spec:
  selector:
    app: chat-service
  ports:
  - port: 8083
    targetPort: 8083
