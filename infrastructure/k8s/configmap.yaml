apiVersion: v1
kind: ConfigMap
metadata:
  name: sumdyk-config
  namespace: sumdyk
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  ALLOWED_ORIGINS: "REPLACE_WITH_PRODUCTION_ORIGINS"
  DEV_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
  USER_SERVICE_URL: "http://user-service:8081"
  MATCHMAKING_SERVICE_URL: "http://matchmaking-service:8082"
  CHAT_SERVICE_URL: "http://chat-service:8083"
  MODERATION_SERVICE_URL: "http://moderation-service:8084"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8085"
