apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking-service
  namespace: sumdyk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaking-service
  template:
    metadata:
      labels:
        app: matchmaking-service
    spec:
      containers:
      - name: matchmaking-service
        image: __IMAGE__
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 2048Mi
        ports:
        - containerPort: 8082
        env:
        - name: PORT
          value: "8082"
        envFrom:
        - configMapRef:
            name: sumdyk-config
        - secretRef:
            name: sumdyk-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaking-service
  namespace: sumdyk
spec:
  selector:
    app: matchmaking-service
  ports:
  - port: 8082
    targetPort: 8082
