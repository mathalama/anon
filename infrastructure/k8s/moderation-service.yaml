apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-service
  namespace: sumdyk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moderation-service
  template:
    metadata:
      labels:
        app: moderation-service
    spec:
      containers:
      - name: moderation-service
        image: ghcr.io/mathalama/moderation-service:latest
        ports:
        - containerPort: 8084
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: sumdyk-secrets
              key: MODERATION_DB_URL
        envFrom:
        - configMapRef:
            name: sumdyk-config
        - secretRef:
            name: sumdyk-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moderation-service
  namespace: sumdyk
spec:
  selector:
    app: moderation-service
  ports:
  - port: 8084
    targetPort: 8084
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moderation-service
  namespace: sumdyk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: moderation-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
