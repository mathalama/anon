apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: sumdyk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: __IMAGE__
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: sumdyk-secrets
              key: USER_DB_URL
        envFrom:
        - configMapRef:
            name: sumdyk-config
        - secretRef:
            name: sumdyk-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: sumdyk
spec:
  selector:
    app: user-service
  ports:
  - port: 8081
    targetPort: 8081
