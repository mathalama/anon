groups:
  - name: platform_alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "Average host CPU usage has exceeded 80% for 5 minutes."

      - alert: ServiceDown
        expr: up{job="nektokz-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "One of the application services is unreachable."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="nektokz-services",instance="api-gateway:8080",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="nektokz-services",instance="api-gateway:8080"}[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate"
          description: "API Gateway 5xx rate is above 5% over 5 minutes."

      - alert: ExcessiveWebSocketConnections
        expr: ws_connections_total > 50000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Excessive WebSocket connections"
          description: "WebSocket connections exceeded 50k on chat-service. Potential load issue."

      - alert: HighWebSocketMessageRate
        expr: rate(ws_messages_total[5m]) > 10000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket message rate"
          description: "WebSocket message processing rate exceeds 10k/sec for 3 minutes."
